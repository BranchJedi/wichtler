ServerName wichtler
ServerTokens Prod
ServerSignature Off
TraceEnable Off

<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    # The API takes small JSON documents only.
    LimitRequestBody 1048576

    SetEnvIfNoCase Authorization "^(.*)$" HTTP_AUTHORIZATION=$1

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Cross-Origin-Opener-Policy "same-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    # A private app: nothing here belongs in a search index.
    Header always set X-Robots-Tag "noindex, nofollow"
    # TLS ends at the reverse proxy; only tell browsers to insist on it when the request came in over HTTPS.
    Header always set Strict-Transport-Security "max-age=31536000" "expr=%{HTTP:X-Forwarded-Proto} == 'https'"

    # The React app: own scripts and styles only. Inline style attributes are needed by the
    # dialog and slider components; inline scripts are not allowed.
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

    # The two exceptions are matched against the original request line, because API requests
    # are rewritten to index.php internally and a <Location> would no longer see their path.
    # API answers are data, never documents: they may load nothing at all.
    Header always set Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" "expr=%{THE_REQUEST} =~ m#^[A-Z]+ /api/#"
    # Swagger UI (Wichtler admin only) is a document again. Its files come from this app, but the
    # page starts itself with an inline script, so inline scripts are allowed on this one address.
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" "expr=%{THE_REQUEST} =~ m#^[A-Z]+ /api/doc([?\s]|$)#"

    <Directory /var/www/html/public>
        Require all granted
        AllowOverride None
        Options -Indexes -MultiViews

        RewriteEngine On

        # API and Symfony-served bundle assets (Swagger UI) go to the front controller.
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^(api|bundles)(/|$) index.php [L]

        # A missing build file is missing; answering with the app shell would hide deployment mistakes.
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^assets/ - [R=404,L]

        # Everything else that is not a real file is a client-side route of the React app.
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.html [L]
    </Directory>

    # Fingerprinted build output may be cached forever, the HTML shell never.
    <Directory /var/www/html/public/assets>
        Header set Cache-Control "public, max-age=31536000, immutable"
    </Directory>
    <Files "index.html">
        Header set Cache-Control "no-cache"
    </Files>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
