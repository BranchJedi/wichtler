ServerName wichtler
ServerTokens Prod
ServerSignature Off

<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    SetEnvIfNoCase Authorization "^(.*)$" HTTP_AUTHORIZATION=$1

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    <Directory /var/www/html/public>
        Require all granted
        AllowOverride None
        Options -Indexes -MultiViews

        RewriteEngine On

        # API and Symfony-served bundle assets (Swagger UI) go to the front controller.
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^(api|bundles)(/|$) index.php [L]

        # Everything else that is not a real file is a client-side route of the React app.
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.html [L]
    </Directory>

    # Fingerprinted build output may be cached forever, the HTML shell never.
    <Directory /var/www/html/public/assets>
        Header set Cache-Control "public, max-age=31536000, immutable"
    </Directory>
    <Files "index.html">
        Header set Cache-Control "no-cache"
    </Files>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
