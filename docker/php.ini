; Symfony reads its configuration from $_ENV; php.ini-production drops "E", which would hide
; the container environment from Apache requests and silently fall back to the values in .env.
variables_order = EGPCS
expose_php = Off
memory_limit = 256M
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
realpath_cache_size = 4096K
realpath_cache_ttl = 600
