lexik_jwt_authentication:
    secret_key: '%env(resolve:JWT_SECRET_KEY)%'
    public_key: '%env(resolve:JWT_PUBLIC_KEY)%'
    pass_phrase: '%env(JWT_PASSPHRASE)%'
    token_ttl: 900

    # The token never reaches JavaScript: it travels in an HttpOnly cookie only.
    token_extractors:
        authorization_header:
            enabled: false
        cookie:
            enabled: true
            name: BEARER
    set_cookies:
        BEARER:
            samesite: strict
            path: /api
            secure: true
            httpOnly: true
    remove_token_from_body_when_cookies_used: true
