framework:
    rate_limiter:
        # Registration needs no e-mail confirmation, so it is throttled per client address.
        # Generous enough for a whole family signing up from the same network.
        registration:
            policy: sliding_window
            limit: 30
            interval: '1 hour'

        # Failed password attempts, see App\Security\LoginRateLimiter.
        # Per username + client address: cleared by a successful login.
        login_per_user:
            policy: fixed_window
            limit: 5
            interval: '15 minutes'
        # Per client address across all usernames: bounds how many accounts one client may try.
        login_per_address:
            policy: fixed_window
            limit: 25
            interval: '15 minutes'
