security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: username

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt)(/|$)
            security: false
        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            entry_point: jwt
            json_login:
                check_path: /api/auth/login
                username_path: username
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
            # Failed password attempts only; limits in config/packages/rate_limiter.yaml.
            login_throttling:
                limiter: App\Security\LoginRateLimiter
            jwt: ~
            refresh_jwt:
                check_path: /api/auth/refresh
                invalidate_token_on_logout: true
            logout:
                path: /api/auth/logout
                delete_cookies:
                    BEARER: { path: /api }

    # Note: Only the *first* matching rule is applied
    access_control:
        - { path: ^/api/auth/(login|register|refresh|logout)$, roles: PUBLIC_ACCESS }
        - { path: ^/api/health$, roles: PUBLIC_ACCESS }
        # Open locally, reserved for the Wichtler admin in production (see config/services.yaml).
        - { path: ^/api/doc, roles: '%app.api_doc_role%' }
        - { path: ^/api/admin/, roles: ROLE_ADMIN }
        - { path: ^/api, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
