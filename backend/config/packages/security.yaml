security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # Replaced by the User entity provider and JWT authentication in stage 2 (accounts).
    providers:
        users_in_memory: { memory: null }

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt)(/|$)
            security: false
        main:
            lazy: true
            stateless: true
            provider: users_in_memory

    # Note: Only the *first* matching rule is applied
    access_control: []

when@prod:
    security:
        access_control:
            # Swagger UI and the OpenAPI document are reserved for the Wichtler admin in production.
            - { path: ^/api/doc, roles: ROLE_ADMIN }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
