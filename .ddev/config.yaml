name: symfony-wichtler
type: symfony
docroot: backend/public
composer_root: backend
php_version: "8.5"
webserver_type: nginx-fpm
xdebug_enabled: false
additional_hostnames: []
additional_fqdns: []
database:
    type: mariadb
    version: "11.8"
use_dns_when_possible: true
composer_version: "2"
nodejs_version: "24"
corepack_enable: false
omit_containers: [ddev-ssh-agent]

# Vite dev server: https://symfony-wichtler.ddev.site:5173 (forwards /api to Symfony)
web_extra_exposed_ports:
    - name: vite
      container_port: 5173
      http_port: 5172
      https_port: 5173
web_extra_daemons:
    - name: vite
      command: "npm install --no-audit --no-fund && npm run api:generate && npm run dev"
      directory: /var/www/html/frontend

# Local Wichtler admin (user 1), created by "app:admin:seed" on start. Development only.
web_environment:
    - ADMIN_USERNAME=admin
    - ADMIN_PASSWORD=wichtler-admin-lokal
hooks:
    post-start:
        - exec: cd backend && composer install --no-interaction --quiet
        - exec: cd backend && php bin/console lexik:jwt:generate-keypair --skip-if-exists
        - exec: cd backend && php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration
        - exec: mysql -uroot -proot -e "CREATE DATABASE IF NOT EXISTS db_test; GRANT ALL ON db_test.* TO 'db'@'%';"
        - exec: cd backend && php bin/console --env=test doctrine:migrations:migrate --no-interaction --allow-no-migration
        - exec: cd backend && php bin/console app:admin:seed
